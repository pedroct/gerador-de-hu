[project]
name = "gerador-hu"
version = "0.1.0"
description = "Skills para refinamento de histórias de usuário e geração de backlog"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "bandit==1.9.4",
  "commitizen==4.16.2",
  "mypy==2.1.0",
  "pip-audit==2.10.0",
  "pre-commit==4.6.0",
  "pytest==9.0.3",
  "pytest-cov==7.0.0",
  "python-semantic-release==10.5.3",
  "ruff==0.15.14",
  "semgrep==1.165.0",
  "sqlfluff==4.2.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["tasks/", ".venv/", ".git/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101"]

[tool.mypy]
# Cada skill é instalável avulsa (`npx skills add --skill ...`), então não pode
# importar módulo de skill irmã: `cliente_jev.py` é cópia byte a byte nas duas.
# O mypy recusa dois módulos de mesmo nome, então a cópia do 3W fica de fora —
# ela é verificada em orquestrar-skills-de-requisito/scripts/cliente_jev.py.
exclude = [
  "refinar-historias-3w/scripts/cliente_jev\\.py$",
  "especificar-debitos-tecnicos/scripts/cliente_jev\\.py$",
]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = [
  "gerar-backlog-azure-boards/scripts",
  "redigir-spec-demanda-azure-boards/scripts",
  "orquestrar-skills-de-requisito/scripts",
  "refinar-historias-3w/scripts",
  "especificar-debitos-tecnicos/scripts",
]

[tool.pytest.ini_options]
testpaths = [
  "gerar-backlog-azure-boards/tests",
  "redigir-spec-pedido-negocio/tests",
  "entrevistar-lacunas-requisito/tests",
  "revisar-textos-requisitos/tests",
  "especificar-debitos-tecnicos/tests",
  "especificar-telas-ux-ui/tests",
  "redigir-spec-demanda-azure-boards/tests",
  "orquestrar-skills-de-requisito/tests",
  "refinar-historias-3w/tests",
]
addopts = "-ra --import-mode=importlib"

[tool.coverage.run]
branch = true
source = [
  "gerar-backlog-azure-boards/scripts",
  "redigir-spec-demanda-azure-boards/scripts",
  "orquestrar-skills-de-requisito/scripts",
  "refinar-historias-3w/scripts",
  "especificar-debitos-tecnicos/scripts",
]

[tool.coverage.report]
exclude_lines = [
  "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"

[tool.semantic_release]
branch = "main"
version_toml = ["pyproject.toml:project.version"]
allow_zero_version = true
commit_parser = "conventional"
build_command = ""

[tool.semantic_release.changelog]
mode = "update"
